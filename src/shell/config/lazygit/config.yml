customCommands:
  - key: "<c-a>"
    context: "files"
    description: "Commit this file with an AI-written conventional commit message"
    command: '"$HOME/.scripts/ai-commit-msg" {{.SelectedFile.Name | quote}}'
    loadingText: "Generating commit message..."
    output: popup
    outputTitle: "AI commit message"
git:
  overrideGpg: true
gui:
  nerdFontsVersion: "3"
  # Branch-drawing glyphs are drawn natively by Ghostty (even through tmux),
  # instead of the classic fallback lazygit picks because tmux reports itself.
  commitGraphStyle: "detailed"
  # Catppuccin Mocha (Blue)
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    authorColors:
      '*': '#b4befe'
