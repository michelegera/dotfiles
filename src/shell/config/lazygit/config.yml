customCommands:
  - key: "<c-a>"
    context: "files"
    description: "Commit this file with an AI-written conventional commit message"
    command: '"$HOME/.scripts/ai-commit-msg" {{.SelectedFile.Name | quote}}'
    loadingText: "Generating commit message..."
    output: popup
    outputTitle: "AI commit message"
git:
  overrideGpg: true
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#7af8ca"
      - "bold"
    inactiveBorderColor:
      - "#828bb8"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#2e3c64"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"
