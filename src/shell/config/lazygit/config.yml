customCommands:
  - key: "<c-a>"
    context: "files"
    description: "Commit this file with an AI-written conventional commit message"
    command: '"$HOME/.scripts/ai-commit-msg" {{.SelectedFile.Name | quote}}'
    loadingText: "Generating commit message..."
    output: popup
    outputTitle: "AI commit message"
git:
  overrideGpg: true
gui:
  nerdFontsVersion: "3"
  # Branch-drawing glyphs are drawn natively by Ghostty (even through tmux),
  # instead of the classic fallback lazygit picks because tmux reports itself.
  commitGraphStyle: "detailed"
  # Ink Meridian
  theme:
    activeBorderColor:
      - '#83A8F2'
      - bold
    inactiveBorderColor: ['#26365A']
    searchingActiveBorderColor: ['#E9C78C']
    optionsTextColor: ['#83A8F2']
    selectedLineFgColor: ['#E6ECF7']
    selectedLineBgColor: ['#25324E']
    inactiveViewSelectedLineBgColor: ['#1A2233']
    cherryPickedCommitFgColor: ['#83A8F2']
    cherryPickedCommitBgColor: ['#233949']
    markedBaseCommitFgColor: ['#83A8F2']
    markedBaseCommitBgColor: ['#3C3834']
    unstagedChangesColor: ['#EC8B97']
    defaultFgColor: ['#CCD6EA']
    authorColors:
      '*': '#A687E0'
    branchColorPatterns:
      '^\*\s': '#9DD4A7'
      '^\+\s': '#9DD4A7'
      '^-\s': '#EC8B97'
      ' -> ': '#E9C78C'
      '^remotes/': '#67B7CF'
      '^tags/': '#BDA3EC'
